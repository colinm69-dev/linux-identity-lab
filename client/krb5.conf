[libdefaults]
    default_realm = LAB.EXAMPLE
    dns_lookup_realm = false
    dns_lookup_kdc = true
    rdns = false
    default_ccache_name = FILE:/tmp/krb5cc_%{uid}

[realms]
    LAB.EXAMPLE = {
        kdc = dc.lab.example
        admin_server = dc.lab.example
    }

[domain_realm]
    .lab.example = LAB.EXAMPLE
    lab.example = LAB.EXAMPLE
